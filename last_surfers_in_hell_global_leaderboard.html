<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Last Surfers in Hell</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #111;
    width: 100%;
    height: 100%;
    height: -webkit-fill-available;
    overflow: hidden;
    margin: 0;
    padding: 0;
    font-family: 'Courier New', monospace;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100%;
    max-height: 100%;
    border: 4px solid #ff4400;
    box-shadow: 0 0 30px #ff2200;
    display: block;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #ffcc00;
    font-size: 18px;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
    z-index: 10;
  }
  #gameOver, #startScreen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #ffcc00;
    text-align: center;
    z-index: 20;
  }
  #gameOver { display: none; }
  h1 {
    font-size: 32px;
    color: #ff2200;
    text-shadow: 3px 3px 0 #000;
    margin-bottom: 20px;
  }
  p { font-size: 18px; margin: 8px 0; color: #ffaa00; }
  .btn {
    margin-top: 25px;
    padding: 12px 30px;
    background: #ff4400;
    color: #fff;
    border: 3px solid #ffcc00;
    font-size: 20px;
    font-family: 'Courier New', monospace;
    cursor: pointer;
    text-shadow: 1px 1px 0 #000;
  }
  .btn:active { background: #cc2200; }
  .highscores {
    width: min(300px, 86vw);
    margin-top: 12px;
    padding: 9px 12px;
    border: 2px solid #ff4400;
    background: rgba(20, 5, 0, 0.88);
    color: #ffcc00;
    font-size: 14px;
    line-height: 1.5;
  }
  .highscores h2 { color: #ff4400; font-size: 17px; margin-bottom: 4px; }
  .highscores ol { list-style-position: inside; text-align: left; }
  .highscores li { display: flex; justify-content: space-between; gap: 12px; }
  .highscores .empty { color: #aa8855; }
  #scoreEntry { display: none; width: min(300px, 86vw); margin-top: 12px; }
  #playerName {
    width: 100%; padding: 10px; border: 2px solid #ffcc00;
    background: #160900; color: #fff; font: 16px 'Courier New', monospace;
    text-align: center; text-transform: uppercase;
  }
  #scoreEntry .btn { margin-top: 8px; width: 100%; }
</style>
</head>
<body>
  <div id="ui">
    <div>SCORE: <span id="score">0</span> &nbsp;&nbsp; LIVES: <span id="lives">4</span></div>
  </div>

  <div id="startScreen">
    <h1>LAST SURFERS<br>IN HELL</h1>
    <p>Dove surfs the sea of fire</p>
    <p>Hold longer = higher jump</p>
    <p>Avoid skeletons & skulls</p>
    <p>4 lives!</p>
    <div class="highscores" id="startHighscores"></div>
    <p style="margin-top:14px;font-size:15px;color:#ff8800">Tap anywhere to start</p>
    <button class="btn" id="startBtn">START</button>
  </div>

  <div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <div id="scoreEntry">
      <p>NEW HIGH SCORE! ENTER YOUR NAME</p>
      <form id="scoreForm">
        <input id="playerName" type="text" maxlength="12" placeholder="YOUR NAME" autocomplete="off" aria-label="Your name">
        <button class="btn" type="submit">SAVE SCORE</button>
        <p id="saveStatus" aria-live="polite" style="font-size:12px;margin-top:6px"></p>
      </form>
    </div>
    <div class="highscores" id="gameOverHighscores"></div>
    <button class="btn" id="restartBtn">TRY AGAIN</button>
  </div>

  <canvas id="game" width="400" height="600"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Supabase settings: fill these in after creating your Supabase project.
const SUPABASE_URL = 'https://ncqnnuehedejsnucwmhy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-5CqTaOY5bp6E6Y4KGKK7A_0s8tYejh';
const supabaseReady = !!(window.supabase && SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('PASTE_') && !SUPABASE_ANON_KEY.includes('PASTE_'));
const supabaseClient = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let shake = 0;
let bossWaveFlash = 0;
let lastTime = 0;

function triggerShake(amount) {
  shake = Math.max(shake, amount);
}

// Resize canvas to fit screen nicely
function resize() {
  const maxW = Math.min(window.innerWidth - 20, 420);
  const maxH = Math.min(window.innerHeight - 20, 640);
  const ratio = 400 / 600;
  let w = maxW;
  let h = w / ratio;
  if (h > maxH) {
    h = maxH;
    w = h * ratio;
  }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
window.addEventListener('resize', resize);
resize();

// Game state
let score = 0;
let lives = 4;
let gameRunning = false;
let gameOver = false;
let frame = 0;
let scrollSpeed = 3;
let gravity = 0.55;
let baseJumpPower = -9.5;
let maxJumpPower = -15.5;

// Variable jump (hold longer = higher)
let isHolding = false;
let holdStartFrame = 0;
let jumpCharged = false;

// Player (Dove on surfboard)
const player = {
  x: 70,
  y: 356,
  width: 50,
  height: 42,
  vy: 0,
  grounded: true,
  invincible: 0
};

// --- Simple 8-bit audio ---
let audioCtx = null;
let musicPlaying = false;
const notes = [
  { freq: 329.63, dur: 0.18 },
  { freq: 329.63, dur: 0.18 },
  { freq: 261.63, dur: 0.22 },
  { freq: 196.00, dur: 0.22 },
  { freq: 220.00, dur: 0.28 }
];
let noteIndex = 0;
let nextNoteTime = 0;

function initAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  } catch (e) {
    audioCtx = null;
  }
}

function playNote(freq, startTime, duration) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.07, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  } catch (e) {}
}

function playJumpSound() {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(420, t);
    osc.frequency.exponentialRampToValueAtTime(680, t + 0.08);
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.14);
  } catch (e) {}
}

function scheduleMusic() {
  if (!musicPlaying || !audioCtx) return;
  try {
    const current = audioCtx.currentTime;
    while (nextNoteTime < current + 0.3) {
      const n = notes[noteIndex];
      playNote(n.freq, nextNoteTime, n.dur);
      nextNoteTime += n.dur + 0.04;
      noteIndex = (noteIndex + 1) % notes.length;
    }
  } catch (e) {}
}

// Obstacles
let obstacles = [];
let obstacleCount = 0;
let spawnTimer = 0;

let waves = [];
for (let i = 0; i < 12; i++) {
  waves.push({
    x: i * 50,
    amp: 8 + Math.random() * 9,
    phase: Math.random() * Math.PI * 2
  });
}

let particles = [];

function startHold() {
  if (!gameRunning || gameOver) return;
  if (player.grounded && !isHolding) {
    isHolding = true;
    holdStartFrame = frame;
    jumpCharged = false;
  }
}

function endHold() {
  if (!isHolding) return;
  isHolding = false;
  if (player.grounded && !jumpCharged) {
    const holdTime = Math.min(frame - holdStartFrame, 25);
    const t = holdTime / 25;
    const power = baseJumpPower + (maxJumpPower - baseJumpPower) * t;
    player.vy = power;
    player.grounded = false;
    jumpCharged = true;
    playJumpSound();
  }
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  startHold();
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  endHold();
}, { passive: false });

canvas.addEventListener('mousedown', startHold);
canvas.addEventListener('mouseup', endHold);
canvas.addEventListener('mouseleave', endHold);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (!e.repeat) startHold();
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    endHold();
  }
});

function handleStart() {
  try {
    initAudio();
  } catch (e) {}
  startGame();
}

const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOver');

const HIGH_SCORE_KEY = 'lastSurfersInHellHighScores_v1';
let pendingHighScore = null;
let sessionScores = [];
let scoreStorage = 'local';
let useSessionScores = false;
let cloudScores = [];
let cloudScoresLoaded = false;
let cloudBusy = false;

function sortTopScores(scores) {
  return scores.slice().sort((a, b) => Number(b.score) - Number(a.score)).slice(0, 5);
}

function loadHighScores() {
  if (supabaseReady && cloudScoresLoaded) return sortTopScores(cloudScores);
  if (useSessionScores) return sortTopScores(sessionScores);
  try {
    const saved = JSON.parse(localStorage.getItem(HIGH_SCORE_KEY) || '[]');
    scoreStorage = 'local';
    return Array.isArray(saved) ? sortTopScores(saved.filter(x =>
      x && typeof x.name === 'string' && Number.isFinite(Number(x.score))
    ).map(x => ({ name: x.name.slice(0, 12), score: Number(x.score) }))) : [];
  } catch (e) {
    scoreStorage = 'session';
    useSessionScores = true;
    return sortTopScores(sessionScores);
  }
}

async function refreshCloudScores() {
  if (!supabaseReady || cloudBusy) return;
  cloudBusy = true;
  try {
    const { data, error } = await supabaseClient
      .from('high_scores')
      .select('name, score')
      .order('score', { ascending: false })
      .limit(5);
    if (error) throw error;
    cloudScores = (data || []).map(x => ({ name: String(x.name).slice(0, 12), score: Number(x.score) }));
    cloudScoresLoaded = true;
    scoreStorage = 'cloud';
    renderHighScores();
  } catch (err) {
    console.warn('Could not load online high scores:', err.message);
    document.getElementById('saveStatus').textContent = 'Online scores unavailable; showing scores on this device.';
  } finally {
    cloudBusy = false;
  }
}

function renderHighScores() {
  const scores = loadHighScores();
  const heading = supabaseReady ? 'GLOBAL TOP 5' : 'TOP 5 HIGH SCORES';
  ['startHighscores', 'gameOverHighscores'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = '<h2>' + heading + '</h2>' + (scores.length
      ? '<ol>' + scores.map(x => `<li><span>${escapeScoreName(x.name)}</span><strong>${Number(x.score).toLocaleString()}</strong></li>`).join('') + '</ol>'
      : '<div class="empty">' + (supabaseReady ? 'Loading scores…' : 'No scores yet — be the first!') + '</div>');
  });
}

function escapeScoreName(name) {
  return String(name).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch]));
}

function qualifiesForHighScore(value) {
  const scores = loadHighScores();
  return scores.length < 5 || value > scores[scores.length - 1].score;
}

function finishRun() {
  pendingHighScore = qualifiesForHighScore(score) ? score : null;
  document.getElementById('scoreEntry').style.display = pendingHighScore !== null ? 'block' : 'none';
  document.getElementById('restartBtn').style.display = pendingHighScore !== null ? 'none' : 'inline-block';
  document.getElementById('saveStatus').textContent = '';
  renderHighScores();
  if (pendingHighScore !== null) {
    const nameInput = document.getElementById('playerName');
    nameInput.value = '';
    setTimeout(() => nameInput.focus(), 150);
  }
}

async function saveHighScore(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (pendingHighScore === null) return;

  const name = document.getElementById('playerName').value.trim().slice(0, 12) || 'PLAYER';
  const scoreToSave = Number(pendingHighScore);
  const status = document.getElementById('saveStatus');
  const saveButton = document.querySelector('#scoreForm button[type="submit"]');
  saveButton.disabled = true;
  status.textContent = supabaseReady ? 'Saving online…' : 'Saving on this device…';

  if (supabaseReady) {
    try {
      const { error } = await supabaseClient.from('high_scores').insert({
        name: name.toUpperCase(),
        score: scoreToSave
      });
      if (error) throw error;
      pendingHighScore = null;
      document.getElementById('scoreEntry').style.display = 'none';
      document.getElementById('restartBtn').style.display = 'inline-block';
      status.textContent = 'Score saved to the global leaderboard!';
      await refreshCloudScores();
    } catch (err) {
      console.error('Online score save failed:', err);
      status.textContent = 'Online save failed. Check connection/settings and try again.';
    } finally {
      saveButton.disabled = false;
    }
    return;
  }

  const scores = loadHighScores();
  scores.push({ name, score: scoreToSave });
  const topFive = sortTopScores(scores);
  let saved = false;
  try {
    localStorage.setItem(HIGH_SCORE_KEY, JSON.stringify(topFive));
    saved = true;
    scoreStorage = 'local';
    useSessionScores = false;
  } catch (err) {
    sessionScores = topFive;
    scoreStorage = 'session';
    useSessionScores = true;
  }
  if (saved) {
    try { saved = JSON.stringify(JSON.parse(localStorage.getItem(HIGH_SCORE_KEY))) === JSON.stringify(topFive); }
    catch (err) { saved = false; }
  }
  if (!saved) { sessionScores = topFive; useSessionScores = true; }
  pendingHighScore = null;
  document.getElementById('scoreEntry').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'inline-block';
  renderHighScores();
  status.textContent = 'Saved on this device only. Add Supabase settings for a shared leaderboard.';
  saveButton.disabled = false;
}

const scoreForm = document.getElementById('scoreForm');
scoreForm.addEventListener('submit', saveHighScore);
scoreForm.addEventListener('click', e => e.stopPropagation());
renderHighScores();
if (supabaseReady) refreshCloudScores();
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshCloudScores(); });

startBtn.addEventListener('click', handleStart);
startBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  handleStart();
}, { passive: false });

restartBtn.addEventListener('click', handleStart);
restartBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  handleStart();
}, { passive: false });

function handleOverlayTap(e) {
  if (e.target.closest('button, input, form')) return;
  handleStart();
}
startScreen.addEventListener('click', handleOverlayTap);
startScreen.addEventListener('touchend', (e) => {
  if (e.target.closest('button, input, form')) return;
  e.preventDefault();
  handleStart();
}, { passive: false });

gameOverScreen.addEventListener('click', handleOverlayTap);
gameOverScreen.addEventListener('touchend', (e) => {
  if (e.target.closest('button, input, form')) return;
  e.preventDefault();
  handleStart();
}, { passive: false });

function startGame() {
  score = 0;
  lives = 4;
  gameRunning = true;
  gameOver = false;
  frame = 0;
  scrollSpeed = 3;
  obstacles = [];
  obstacleCount = 0;
  spawnTimer = 35;
  particles = [];
  player.y = 358;
  player.vy = 0;
  player.grounded = true;
  player.invincible = 0;
  isHolding = false;
  jumpCharged = false;
  noteIndex = 0;
  shake = 0;
  bossWaveFlash = 0;
  if (audioCtx) {
    nextNoteTime = audioCtx.currentTime + 0.1;
    musicPlaying = true;
  }
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOver').style.display = 'none';
  document.getElementById('score').textContent = '0';
  document.getElementById('lives').textContent = '4';
  document.getElementById('scoreEntry').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'inline-block';
}

function spawnObstacle() {
  obstacleCount++;
  const bossWave = obstacleCount > 2 && obstacleCount % 12 === 0 && frame > 180;

  if (bossWave) {
    const count = obstacleCount % 24 === 0 ? 3 : 2;
    for (let i = 0; i < count; i++) {
      obstacles.push({
        x: canvas.width + 60 + i * 58,
        y: 420 - 68,
        width: 52,
        height: 74,
        type: 'soldier',
        boss: true,
        vy: -(4 + Math.random() * 3),
        baseY: 420 - 74,
        jumpPhase: i * 0.9,
        glow: 0
      });
    }
    bossWaveFlash = 1;
    triggerShake(9);
    return;
  }

  const isSoldier = obstacleCount % 10 === 0 && frame > 120;
  const type = isSoldier ? 'soldier' : (Math.random() < 0.6 ? 'skull' : 'skeleton');
  const width = isSoldier ? 48 : (type === 'skull' ? 26 : 30);
  const height = isSoldier ? 68 : (type === 'skull' ? 28 : 42);
  obstacles.push({
    x: canvas.width + 20,
    y: 420 - height,
    width, height, type,
    boss: false,
    vy: -(4 + Math.random() * 3),
    baseY: 420 - height,
    jumpPhase: 0,
    glow: 0
  });
}

function drawSoldier(x, y, boss = false) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };

  if (boss) {
    ctx.fillStyle = 'rgba(255, 90, 0, 0.28)';
    ctx.fillRect(-5, 0, 60, 80);
    ctx.fillStyle = 'rgba(255, 200, 60, 0.28)';
    ctx.fillRect(10, -6, 30, 10);
  }

  px(3, 64, 43, 4, '#260600');
  px(8, 8, 32, 53, '#5b1008');
  px(8, 48, 13, 13, '#272a30'); px(27, 48, 13, 13, '#272a30');
  px(5, 58, 17, 7, '#111820'); px(25, 58, 18, 7, '#111820');
  px(11, 50, 7, 7, '#85816d'); px(30, 50, 7, 7, '#85816d');
  px(8, 23, 32, 29, '#4d5960'); px(11, 26, 26, 21, '#89918a');
  px(14, 29, 20, 14, '#343b43'); px(17, 31, 14, 9, '#a53a20'); px(19, 33, 10, 5, '#ffb52e');
  px(2, 24, 12, 15, '#68737a'); px(34, 24, 12, 15, '#68737a');
  px(4, 37, 8, 13, '#303942'); px(36, 37, 8, 13, '#303942');
  px(1, 47, 12, 6, '#a3a18b'); px(35, 47, 12, 6, '#a3a18b');
  px(12, 4, 24, 20, '#68737a'); px(15, 0, 18, 7, '#a7a99a');
  px(9, 8, 30, 10, '#343d45'); px(14, 11, 22, 6, '#ff8a20');
  px(17, 12, 15, 3, '#ffe46b');
  px(20, 0, 5, 4, '#b32a12'); px(25, -3, 5, 5, '#f04b16');
  px(12, 27, 4, 3, '#d4c9a0'); px(32, 27, 4, 3, '#d4c9a0');
  px(14, 43, 4, 3, '#c6c2a8'); px(29, 43, 4, 3, '#c6c2a8');
  ctx.restore();
}

function update() {
  if (!gameRunning || gameOver) {
    musicPlaying = false;
    shake *= 0.82;
    return;
  }

  frame += 1;
  score = Math.floor(frame / 6);
  document.getElementById('score').textContent = score;

  if (frame > 300) {
    const t = (frame - 300) / 1800;
    scrollSpeed = 3 + Math.min(t * 4.5, 4.5);
  }

  if (isHolding && player.grounded && (frame - holdStartFrame) >= 25) {
    endHold();
  }

  player.vy += gravity;
  player.y += player.vy;

  const groundY = 400;
  if (player.y + player.height > groundY) {
    player.y = groundY - player.height;
    player.vy = 0;
    player.grounded = true;
  }

  if (player.invincible > 0) player.invincible--;

  scheduleMusic();

  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = 70 + Math.random() * 50 - Math.min(frame / 100, 30);
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= scrollSpeed;
    o.jumpPhase += 0.12;
    o.y = o.baseY + Math.sin(o.jumpPhase) * 35 - 15;

    if (o.x + o.width < 0) {
      obstacles.splice(i, 1);
      continue;
    }

    if (player.invincible <= 0 &&
        player.x < o.x + o.width - 8 &&
        player.x + player.width > o.x + 8 &&
        player.y < o.y + o.height - 6 &&
        player.y + player.height > o.y + 6) {
      lives--;
      document.getElementById('lives').textContent = lives;
      player.invincible = 60;
      triggerShake(lives <= 0 ? 14 : 8);

      for (let p = 0; p < 7; p++) {
        particles.push({
          x: player.x + player.width/2,
          y: player.y + player.height/2,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          life: 22 + Math.random() * 14,
          color: Math.random() < 0.5 ? '#ff4400' : '#ffcc00'
        });
      }

      if (lives <= 0) {
        gameOver = true;
        gameRunning = false;
        document.getElementById('finalScore').textContent = score;
        document.getElementById('gameOver').style.display = 'flex';
        finishRun();
      }
    }
  }

  waves.forEach(w => {
    w.x -= scrollSpeed * 0.7;
    if (w.x < -50) w.x += 600;
    w.phase += 0.08;
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (frame % 4 === 0 && particles.length < 45) {
    particles.push({
      x: Math.random() * canvas.width,
      y: 420 + Math.random() * 40,
      vx: -scrollSpeed * 0.4 + (Math.random() - 0.5),
      vy: -1.2 - Math.random() * 2.2,
      life: 30 + Math.random() * 25,
      color: Math.random() < 0.65 ? '#ff5500' : '#ffaa00'
    });
    if (Math.random() < 0.4) {
      const fromLeft = Math.random() < 0.5;
      particles.push({
        x: fromLeft ? Math.random() * 30 : canvas.width - Math.random() * 30,
        y: 150 + Math.random() * 250,
        vx: fromLeft ? 1 + Math.random() * 2 : -1 - Math.random() * 2,
        vy: -0.5 - Math.random() * 1.5,
        life: 25 + Math.random() * 20,
        color: Math.random() < 0.5 ? '#ff3300' : '#ffcc00'
      });
    }
  }

  bossWaveFlash *= 0.9;
  shake *= 0.82;
}

function drawDove(x, y, invincible) {
  if (invincible > 0 && Math.floor(invincible / 4) % 2 === 0) return;
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = '#5C3317';
  ctx.fillRect(0, 32, 50, 9);
  ctx.fillStyle = '#B86B2A';
  ctx.fillRect(3, 34, 44, 4);
  ctx.fillStyle = '#3D220F';
  ctx.beginPath();
  ctx.moveTo(38, 41);
  ctx.lineTo(46, 41);
  ctx.lineTo(42, 51);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#E8E4DC';
  ctx.beginPath();
  ctx.ellipse(22, 20, 19, 15, 0.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#F7F5F0';
  ctx.beginPath();
  ctx.ellipse(24, 24, 13, 10, 0.05, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#D4CFC4';
  ctx.beginPath();
  ctx.ellipse(13, 17, 13, 9, -0.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#C0B8A8';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(7, 15);
  ctx.quadraticCurveTo(13, 19, 18, 17);
  ctx.moveTo(8, 18);
  ctx.quadraticCurveTo(13, 21, 17, 19);
  ctx.stroke();

  ctx.fillStyle = '#EDE9E0';
  ctx.beginPath();
  ctx.arc(36, 12, 9.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#E8E4DC';
  ctx.beginPath();
  ctx.ellipse(30, 16, 8, 6, -0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(38, 10.5, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(38.7, 9.7, 0.9, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#C47A3A';
  ctx.beginPath();
  ctx.moveTo(44, 12);
  ctx.lineTo(50, 13.5);
  ctx.lineTo(44, 15.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#A05E28';
  ctx.beginPath();
  ctx.moveTo(47.5, 13);
  ctx.lineTo(50, 13.5);
  ctx.lineTo(47.5, 14.5);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(220, 180, 160, 0.25)';
  ctx.beginPath();
  ctx.arc(40, 14, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#C8C0B0';
  ctx.beginPath();
  ctx.moveTo(32, 4);
  ctx.lineTo(33.5, 0);
  ctx.lineTo(35.5, 4);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(35, 3.5);
  ctx.lineTo(37, -0.5);
  ctx.lineTo(38, 4);
  ctx.fill();

  ctx.strokeStyle = '#C47A3A';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(16, 32);
  ctx.lineTo(14, 40);
  ctx.moveTo(27, 32);
  ctx.lineTo(29, 40);
  ctx.stroke();
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(12, 40); ctx.lineTo(16, 40);
  ctx.moveTo(27, 40); ctx.lineTo(31, 40);
  ctx.stroke();
  ctx.restore();
}

function drawSkull(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255, 60, 0, 0.35)';
  ctx.beginPath();
  ctx.arc(14, 14, 18, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#F0E8C8';
  ctx.beginPath();
  ctx.arc(14, 13, 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#1a0000';
  ctx.beginPath();
  ctx.arc(9, 11, 4, 0, Math.PI * 2);
  ctx.arc(19, 11, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255, 40, 0, 0.7)';
  ctx.beginPath();
  ctx.arc(9, 11, 2, 0, Math.PI * 2);
  ctx.arc(19, 11, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.moveTo(14, 14);
  ctx.lineTo(11, 19);
  ctx.lineTo(17, 19);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#F0E8C8';
  ctx.fillRect(7, 22, 14, 7);
  ctx.fillStyle = '#222';
  for (let i = 0; i < 4; i++) {
    ctx.fillRect(9 + i * 3.2, 22, 1.8, 7);
  }
  ctx.restore();
}

function drawSkeleton(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255, 50, 0, 0.3)';
  ctx.beginPath();
  ctx.arc(16, 24, 22, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#F0E8C8';
  ctx.beginPath();
  ctx.arc(16, 9, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a0000';
  ctx.beginPath();
  ctx.arc(13, 8, 2.5, 0, Math.PI * 2);
  ctx.arc(19, 8, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255, 30, 0, 0.8)';
  ctx.beginPath();
  ctx.arc(13, 8, 1.2, 0, Math.PI * 2);
  ctx.arc(19, 8, 1.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#F0E8C8';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(16, 18);
  ctx.lineTo(16, 34);
  ctx.moveTo(7, 21); ctx.lineTo(25, 21);
  ctx.moveTo(8, 25); ctx.lineTo(24, 25);
  ctx.moveTo(9, 29); ctx.lineTo(23, 29);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(16, 20);
  ctx.lineTo(4, 10);
  ctx.moveTo(16, 20);
  ctx.lineTo(28, 10);
  ctx.moveTo(2, 9); ctx.lineTo(6, 11);
  ctx.moveTo(26, 11); ctx.lineTo(30, 9);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(16, 34);
  ctx.lineTo(8, 46);
  ctx.moveTo(16, 34);
  ctx.lineTo(24, 46);
  ctx.stroke();

  ctx.restore();
}

function drawBackground() {
  const skylineShift = (frame * 0.22) % 42;
  const lavaShift = (frame * 1.2) % 42;
  const emberShift = (frame * 0.9) % canvas.width;

  ctx.fillStyle = '#120914';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#24101b';
  ctx.fillRect(0, 0, canvas.width, 250);
  ctx.fillStyle = '#35101a';
  ctx.fillRect(0, 250, canvas.width, 155);

  ctx.fillStyle = '#170b18';
  for (let i = 0; i < 12; i++) {
    const bx = i * 42 - skylineShift;
    const peak = 210 + ((i * 31) % 58);
    ctx.beginPath();
    ctx.moveTo(bx, 330);
    ctx.lineTo(bx, peak + 18);
    ctx.lineTo(bx + 12, peak);
    ctx.lineTo(bx + 22, peak + 16);
    ctx.lineTo(bx + 33, peak - 6);
    ctx.lineTo(bx + 47, 330);
    ctx.fill();
  }

  ctx.fillStyle = '#5b1014';
  ctx.fillRect(0, 397, canvas.width, 203);
  ctx.fillStyle = '#9b1b13';
  ctx.fillRect(0, 411, canvas.width, 189);

  for (let i = 0; i < 26; i++) {
    const x = ((i * 19 - lavaShift) % 440 + 440) % 440 - 20;
    const y = 414 + ((i * 13) % 22);
    ctx.fillStyle = i % 3 === 0 ? '#ff6a16' : (i % 3 === 1 ? '#d93412' : '#ff9b20');
    ctx.fillRect(Math.round(x / 4) * 4, y, 12 + (i % 4) * 4, 4 + (i % 2) * 3);
  }

  function pixelFlame(baseX, baseY, height, phase, scale) {
    const flick = Math.round(Math.sin(frame * 0.19 + phase) * 2);
    const h = Math.max(4, height + flick);
    const w = 5 * scale;
    const x = Math.round(baseX / scale) * scale;
    const y = Math.round(baseY / scale) * scale;
    const bands = [
      { c: '#8e1014', inset: 0, top: 0 },
      { c: '#ed3511', inset: 1, top: 2 },
      { c: '#ff7a18', inset: 2, top: 4 },
      { c: '#ffd34a', inset: 3, top: 7 }
    ];
    bands.forEach((b, idx) => {
      const fh = Math.max(3, h - b.top);
      const tip = x + (Math.floor((frame / 5 + phase * 3 + idx) % 3) - 1) * scale;
      ctx.fillStyle = b.c;
      ctx.fillRect(tip + b.inset * scale, y - fh, Math.max(scale, w - b.inset * 2 * scale), fh);
      ctx.fillRect(tip + (b.inset + 1) * scale, y - fh - 2 * scale, Math.max(scale, w - (b.inset + 2) * scale), 2 * scale);
    });
  }

  for (let i = 0; i < 18; i++) {
    const x = ((i * 25 + frame * (1.1 + (i % 3) * 0.25) + emberShift * 0.15) % 450) - 25;
    pixelFlame(x, 426 + (i % 3) * 7, 24 + (i * 11) % 38, i * 1.7, 3);
  }

  for (let i = 0; i < 5; i++) {
    pixelFlame(4 + (i % 2) * 7, 400 - i * 43, 34 + (i * 7) % 27, i * 2.2, 3);
    pixelFlame(canvas.width - 20 - (i % 2) * 7, 400 - i * 43, 36 + (i * 9) % 25, i * 2.7, 3);
  }

  for (let i = 0; i < 24; i++) {
    const sx = (i * 47 + Math.floor(frame * (0.7 + (i % 4) * 0.13)) + emberShift * 0.4) % canvas.width;
    const sy = 370 - ((frame * (1 + (i % 3) * 0.35) + i * 31) % 220);
    ctx.fillStyle = i % 4 === 0 ? '#fff078' : (i % 2 ? '#ff9b24' : '#e94316');
    ctx.fillRect(Math.floor(sx / 3) * 3, Math.floor(sy / 3) * 3, 3, 3);
  }

  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#ffcc00';
  ctx.font = 'bold 42px Courier New, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('LÜBBEN DÜE', canvas.width / 2, canvas.height / 2 - 30);
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0.2) {
    ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
  }

  drawBackground();

  obstacles.forEach(o => {
    if (o.type === 'skull') drawSkull(o.x, o.y);
    else if (o.type === 'soldier') drawSoldier(o.x, o.y, o.boss);
    else drawSkeleton(o.x, o.y);
  });

  drawDove(player.x, player.y, player.invincible);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 3, 3);
  }

  if (bossWaveFlash > 0.05) {
    ctx.fillStyle = `rgba(255, 120, 0, ${bossWaveFlash * 0.26})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  ctx.restore();
}

function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 16.67, 2.5);
  lastTime = timestamp;

  if (gameRunning) {
    for (let i = 0; i < dt; i++) {
      update();
    }
  } else {
    shake *= 0.85;
  }

  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
